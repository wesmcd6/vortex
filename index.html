<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vortex</title>
<style>
  :root{ --void:#03030a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-user-drag:none}
  html,body{height:100%;margin:0;background:var(--void);overflow:hidden;
    overscroll-behavior:none;touch-action:none}
  canvas{display:block;width:100%;height:100%;touch-action:none;
    background:radial-gradient(130% 100% at 50% 50%, #0a0a18 0%, #03030a 65%, #000 100%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================
   VORTEX — vector tube shooter in the Tempest tradition
   Single file, no dependencies. All UI drawn on canvas so touch
   devices never raise selection or translate popups.
   ============================================================ */

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d', { alpha:false });
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tuning ---------- */
const PLAYER_SPEED  = 8.5;     // lanes per second
const SHOT_SPEED    = 1.55;    // depth units per second
const MAX_SHOTS     = 7;
const ENEMY_SHOT_SP = 0.85;
const RIM_SPEED     = 2.2;     // enemy travel along the rim, lanes/sec
const SPIKE_MAX     = 0.86;
const INNER         = 0.26;    // far end size as a fraction of the rim
const PERSP         = 1.5;     // depth curve

const SCORE = { flipper:150, tanker:100, spiker:50, fuseball:250, pulsar:200, spike:1 };

/* ---------- palette, cycles per level like the cabinet did ---------- */
const PALETTES = [
  { web:'#3d7bff', rim:'#7fb2ff', accent:'#ff4d4d' },
  { web:'#ff4d4d', rim:'#ff9a9a', accent:'#ffe14d' },
  { web:'#ffe14d', rim:'#fff3a8', accent:'#4dff9a' },
  { web:'#4dff9a', rim:'#b6ffd8', accent:'#ff4dd8' },
  { web:'#c14dff', rim:'#e0b0ff', accent:'#4de1ff' },
  { web:'#4de1ff', rim:'#b3f2ff', accent:'#ff8a3d' },
];
const C_TEXT = '#cfd6ff';

/* ============================================================
   web shapes
   ============================================================ */
function poly(n, r, rot = 0){
  const p = [];
  for (let i = 0; i < n; i++){
    const a = rot + i / n * Math.PI * 2;
    p.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return p;
}
function starPoly(n, r1, r2, rot = 0){
  const p = [];
  for (let i = 0; i < n * 2; i++){
    const a = rot + i / (n * 2) * Math.PI * 2, r = i % 2 ? r2 : r1;
    p.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return p;
}
function crossPoly(r, t){
  const a = r, b = r * t, p = [];
  const raw = [[b,a],[-b,a],[-b,b],[-a,b],[-a,-b],[-b,-b],[-b,-a],[b,-a],[b,-b],[a,-b],[a,b],[b,b]];
  for (const q of raw) p.push([q[0], q[1]]);
  return p;
}
/* resample a polygon/polyline into exactly the segment count we want */
function resample(pts, closed, segs){
  const P = closed ? pts.concat([pts[0]]) : pts;
  const seg = [], len = [];
  let total = 0;
  for (let i = 0; i < P.length - 1; i++){
    const d = Math.hypot(P[i+1][0] - P[i][0], P[i+1][1] - P[i][1]);
    seg.push(d); len.push(total); total += d;
  }
  const out = [], count = closed ? segs : segs + 1;
  for (let k = 0; k < count; k++){
    const target = total * (k / segs);
    let i = 0;
    while (i < seg.length - 1 && len[i] + seg[i] < target) i++;
    const f = seg[i] ? (target - len[i]) / seg[i] : 0;
    out.push([ P[i][0] + (P[i+1][0] - P[i][0]) * f,
               P[i][1] + (P[i+1][1] - P[i][1]) * f ]);
  }
  return out;
}
const SHAPES = [
  { name:'CIRCLE',   closed:true,  segs:16, make:() => poly(64, 1) },
  { name:'SQUARE',   closed:true,  segs:16, make:() => poly(4, 1, Math.PI/4) },
  { name:'PLUS',     closed:true,  segs:16, make:() => crossPoly(1, .36) },
  { name:'FLAT',     closed:false, segs:16, make:() => [[-1.15,.35],[1.15,.35]] },
  { name:'VEE',      closed:false, segs:16, make:() => [[-1.1,-.5],[0,.75],[1.1,-.5]] },
  { name:'TRIANGLE', closed:true,  segs:15, make:() => poly(3, 1.05, -Math.PI/2) },
  { name:'STAR',     closed:true,  segs:16, make:() => starPoly(5, 1.05, .45, -Math.PI/2) },
  { name:'DOUBLE V', closed:false, segs:16, make:() => [[-1.15,-.35],[-.55,.55],[0,-.3],[.55,.55],[1.15,-.35]] },
  { name:'HEXAGON',  closed:true,  segs:12, make:() => poly(6, 1) },
  { name:'STEPS',    closed:false, segs:16, make:() => [[-1.1,-.6],[-.6,-.6],[-.6,-.1],[-.1,-.1],[-.1,.4],[.5,.4],[.5,.8],[1.1,.8]] },
  { name:'CLOVER',   closed:true,  segs:16, make:() => {
      const p = [];
      for (let i = 0; i < 96; i++){
        const a = i / 96 * Math.PI * 2, r = .62 + .42 * Math.abs(Math.cos(2 * a));
        p.push([Math.cos(a) * r, Math.sin(a) * r]);
      }
      return p; } },
  { name:'PENTAGON', closed:true,  segs:15, make:() => poly(5, 1.02, -Math.PI/2) },
];

/* ============================================================
   state
   ============================================================ */
let cw = 0, ch = 0, dpr = 1;
let state = 'title';            // title | play | warp | dead | gameover | briefing
let web = null, pal = PALETTES[0];
let level = 1, score = 0, hiScore = 0, lives = 3, nextLife = 20000;
let player, shots = [], enemies = [], eshots = [], bits = [], spikes = [];
let zapCharge = 2, zapFlash = 0, shake = 0, msg = null, holdTimer = 0;
let spawnLeft = 0, spawnTimer = 0, warpZ = 0, showTouch = matchMedia('(pointer:coarse)').matches;
const keys = Object.create(null);
const touch = { l:false, r:false, f:false, z:false };

for (const ev of ['contextmenu','selectstart','dragstart']) addEventListener(ev, e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
addEventListener('dblclick', e => e.preventDefault());

/* ============================================================
   geometry helpers
   ============================================================ */
function buildWeb(lv){
  const S = SHAPES[(lv - 1) % SHAPES.length];
  const pts = resample(S.make(), S.closed, S.segs);
  const n = S.closed ? pts.length : pts.length - 1;
  web = { name:S.name, closed:S.closed, n, edges:pts };
  pal = PALETTES[(lv - 1) % PALETTES.length];
  spikes = new Array(n).fill(0);
}
const depth = z => Math.pow(Math.max(0, Math.min(1, z)), PERSP);
/* point on edge k (float) at depth z; z=1 rim, z=0 far end */
function edgePt(k, z){
  const n = web.n, E = web.edges;
  let i, f;
  if (web.closed){ k = ((k % n) + n) % n; i = Math.floor(k); f = k - i; }
  else { k = Math.max(0, Math.min(n, k)); i = Math.min(n - 1, Math.floor(k)); f = k - i; }
  const a = E[i], b = E[web.closed ? (i + 1) % n : i + 1];
  const x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
  const s = INNER + (1 - INNER) * depth(z);
  return [x * s, y * s];
}
const laneMid = (lane, z) => edgePt(lane + 0.5, z);
function wrapLane(l){
  const n = web.n;
  return web.closed ? ((l % n) + n) % n : Math.max(0, Math.min(n - 1, l));
}
/* shortest signed lane distance a -> b */
function laneDelta(a, b){
  const n = web.n;
  let d = b - a;
  if (web.closed){ while (d >  n/2) d -= n; while (d < -n/2) d += n; }
  return d;
}

/* ============================================================
   lifecycle
   ============================================================ */
function startLevel(lv){
  level = lv;
  buildWeb(lv);
  shots = []; enemies = []; eshots = []; bits = [];
  player = { lane: Math.floor(web.n / 2) + .0, cool: 0, grabbed: null };
  zapCharge = 2;
  const d = 1 + (lv - 1) * 0.13;
  spawnLeft = Math.min(52, 16 + lv * 3);
  spawnTimer = 0.6;
  state = 'play';
  msg = { t: 1.6, s: 'LEVEL ' + lv + '  \u2014  ' + web.name };
}
function startGame(){
  score = 0; lives = 3; nextLife = 20000;
  startLevel(1);
}
function loseLife(){
  if (state !== 'play') return;
  lives--;
  burst(laneMid(player.lane, 1), '#fff', 26);
  sfx.boom();
  if (!REDUCED) shake = 1;
  if (lives <= 0){
    hiScore = Math.max(hiScore, score);
    state = 'gameover'; holdTimer = 3.0;
  } else {
    state = 'dead'; holdTimer = 1.6;
  }
}
function respawn(){
  enemies = enemies.filter(e => e.z < .55);
  eshots = [];
  player.grabbed = null;
  state = 'play';
}

/* ============================================================
   enemies
   ============================================================ */
function enemyMix(lv){
  const bag = ['flipper','flipper','flipper'];
  if (lv >= 2) bag.push('tanker');
  if (lv >= 3) bag.push('spiker','spiker');
  if (lv >= 5) bag.push('fuseball');
  if (lv >= 7) bag.push('pulsar');
  if (lv >= 9) bag.push('tanker','fuseball');
  return bag[Math.floor(Math.random() * bag.length)];
}
function spawnEnemy(type, lane, z){
  const e = { type, lane: wrapLane(lane), z: z ?? 0.02, flip:null, t: Math.random() * 3,
              speed: 0.055 + level * 0.004 + Math.random() * 0.03,
              rimT: 0, edge: null, pulse: 0, hp: 1 };
  if (type === 'tanker'){ e.speed *= .8; e.hp = 1; }
  if (type === 'spiker'){ e.speed *= 1.15; e.zTop = 0.15 + Math.random() * 0.5; e.dir = 1; }
  if (type === 'fuseball'){ e.edge = e.lane; e.speed *= .9; e.wob = Math.random() * 6; }
  if (type === 'pulsar'){ e.speed *= .85; }
  enemies.push(e);
  return e;
}
function killEnemy(e, byPlayer){
  const i = enemies.indexOf(e);
  if (i < 0) return;
  enemies.splice(i, 1);
  const p = e.type === 'fuseball' ? edgePt(e.edge, e.z) : laneMid(e.lane, e.z);
  burst(p, pal.accent, 12);
  if (byPlayer){
    addScore(SCORE[e.type] || 100);
    if (e.type === 'tanker'){
      const kids = level >= 6 ? (Math.random() < .5 ? 'fuseball' : 'pulsar') : 'flipper';
      spawnEnemy(kids, e.lane - 1, e.z);
      spawnEnemy(kids, e.lane + 1, e.z);
    }
  }
  sfx.pop();
}
function addScore(v){
  score += v;
  if (score >= nextLife){ lives++; nextLife += 20000; msg = { t:1.4, s:'EXTRA LIFE' }; sfx.blip(1200); }
}

/* ============================================================
   input
   ============================================================ */
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  sfx.unlock();
  if (state === 'briefing'){ if (['Escape','KeyH','Enter','Space'].includes(e.code)) state = 'title'; return; }
  if (e.code === 'KeyH'){ state = 'briefing'; return; }
  if (state === 'title' && (e.code === 'Space' || e.code === 'Enter')) startGame();
  else if (state === 'gameover' && holdTimer <= 0 && (e.code === 'Space' || e.code === 'Enter')) state = 'title';
  if (e.code === 'KeyM') sfx.toggle();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; ptr.clear(); applyTouch(); });

function ctrlLayout(){
  const h = Math.max(62, Math.min(96, ch * 0.14));
  const g = Math.max(7, cw * 0.012);
  const y = ch - h - g;
  const u = (cw - g * 5) / 4;
  return { h, y, l:{x:g,w:u}, r:{x:g*2+u,w:u}, f:{x:g*3+u*2,w:u}, z:{x:g*4+u*3,w:u} };
}
const controlsVisible = () => showTouch && (state === 'play' || state === 'warp' || state === 'dead');
function hitZone(px, py){
  if (!controlsVisible()) return null;
  const L = ctrlLayout();
  if (py < L.y || py > L.y + L.h) return null;
  for (const k of ['l','r','f','z']) if (px >= L[k].x && px <= L[k].x + L[k].w) return k;
  return null;
}
const ptr = new Map();
function applyTouch(){
  const s = new Set(ptr.values());
  touch.l = s.has('l'); touch.r = s.has('r'); touch.f = s.has('f'); touch.z = s.has('z');
}
function localPt(e){ const r = cvs.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType !== 'mouse') showTouch = true;
  sfx.unlock();
  try { cvs.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = localPt(e);
  if (state === 'briefing'){ state = 'title'; return; }
  if (state === 'title'){ if (inRect(x, y, briefRect())) state = 'briefing'; else startGame(); return; }
  if (state === 'gameover'){ if (holdTimer <= 0) state = 'title'; return; }
  ptr.set(e.pointerId, hitZone(x, y)); applyTouch();
});
cvs.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return;
  e.preventDefault();
  const [x, y] = localPt(e);
  ptr.set(e.pointerId, hitZone(x, y)); applyTouch();
});
for (const ev of ['pointerup','pointercancel','pointerout','lostpointercapture'])
  cvs.addEventListener(ev, e => { if (ptr.delete(e.pointerId)) applyTouch(); });
for (const ev of ['touchstart','touchmove','touchend'])
  cvs.addEventListener(ev, e => e.preventDefault(), { passive:false });
const inRect = (x, y, b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function briefRect(){ const w = Math.min(240, cw * .6), h = 42; return { x: cw/2 - w/2, y: ch*.8, w, h }; }

/* ============================================================
   update
   ============================================================ */
function update(dt){
  for (const b of bits){ b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt; }
  bits = bits.filter(b => b.life > 0);
  if (msg){ msg.t -= dt; if (msg.t <= 0) msg = null; }
  if (zapFlash > 0) zapFlash = Math.max(0, zapFlash - dt * 2.2);
  if (shake > 0) shake = Math.max(0, shake - dt * 2.4);

  if (state === 'dead' || state === 'gameover'){
    holdTimer -= dt;
    if (holdTimer <= 0 && state === 'dead') respawn();
    return;
  }
  if (state === 'warp'){ updateWarp(dt); return; }
  if (state !== 'play') return;

  /* player */
  const L = keys.ArrowLeft || keys.KeyA || touch.l;
  const R = keys.ArrowRight || keys.KeyD || touch.r;
  if (!player.grabbed){
    if (L && !R) player.lane -= PLAYER_SPEED * dt;
    if (R && !L) player.lane += PLAYER_SPEED * dt;
    if (web.closed){ const n = web.n; player.lane = ((player.lane % n) + n) % n; }
    else player.lane = Math.max(0, Math.min(web.n - 1, player.lane));
  }
  player.cool -= dt;
  const fire = keys.Space || keys.KeyW || keys.ArrowUp || touch.f;
  if (fire && player.cool <= 0 && shots.length < MAX_SHOTS){
    shots.push({ lane: Math.floor(player.lane + .5) % web.n, z: .97 });
    player.cool = .11; sfx.zap();
  }
  if ((keys.KeyZ || keys.ShiftLeft || touch.z) && zapCharge > 0 && !keys._zapHeld){
    keys._zapHeld = true;
    superzap();
  }
  if (!(keys.KeyZ || keys.ShiftLeft || touch.z)) keys._zapHeld = false;

  /* shots */
  for (const s of shots){
    s.z -= SHOT_SPEED * dt;
    if (spikes[s.lane] > 0 && s.z <= spikes[s.lane]){
      spikes[s.lane] = Math.max(0, spikes[s.lane] - .06);
      addScore(SCORE.spike); s.dead = true; sfx.tick();
    }
  }
  shots = shots.filter(s => s.z > 0 && !s.dead);

  /* enemy shots */
  for (const s of eshots) s.z += ENEMY_SHOT_SP * dt;
  eshots = eshots.filter(s => {
    if (s.z >= .98){
      if (Math.abs(laneDelta(s.lane, Math.floor(player.lane + .5) % web.n)) < .6) loseLife();
      return false;
    }
    return true;
  });

  updateEnemies(dt);

  /* shot vs enemy */
  for (const s of shots){
    for (const e of enemies){
      const hit = e.type === 'fuseball'
        ? Math.abs(laneDelta(e.edge, s.lane + .5)) < .75 && Math.abs(e.z - s.z) < .06
        : e.lane === s.lane && Math.abs(e.z - s.z) < .055;
      if (hit){ s.dead = true; killEnemy(e, true); break; }
    }
  }
  shots = shots.filter(s => !s.dead);

  /* spawning */
  if (spawnLeft > 0){
    spawnTimer -= dt;
    const cap = Math.min(9, 3 + Math.floor(level / 2));
    if (spawnTimer <= 0 && enemies.length < cap){
      spawnEnemy(enemyMix(level), Math.floor(Math.random() * web.n));
      spawnLeft--;
      spawnTimer = Math.max(.28, 1.5 - level * .06);
    }
  } else if (enemies.length === 0){
    state = 'warp'; warpZ = 0; msg = spikes.some(s => s > .05) ? { t:2, s:'AVOID SPIKES' } : null;
    sfx.warp();
  }
}

function updateEnemies(dt){
  const pLane = Math.floor(player.lane + .5) % web.n;
  for (const e of enemies){
    e.t += dt;

    if (e.type === 'spiker'){
      /* rides its lane building a spike, then retreats and climbs again */
      e.z += e.speed * e.dir * dt * 2.2;
      if (e.z > e.zTop){ e.dir = -1; }
      if (e.z < .06){ e.dir = 1; e.zTop = Math.min(SPIKE_MAX, e.zTop + .12); }
      spikes[e.lane] = Math.max(spikes[e.lane], Math.min(SPIKE_MAX, e.z));
      continue;
    }

    if (e.type === 'fuseball'){
      /* travels the lane edges, wanders sideways, deadly at the rim */
      e.z += e.speed * dt * (1 + .4 * Math.sin(e.t * 2.1 + e.wob));
      if (Math.sin(e.t * 1.7 + e.wob) > .82){
        e.edge += Math.sign(Math.cos(e.t * 3.1)) * dt * 2.6;
        e.edge = web.closed ? ((e.edge % web.n) + web.n) % web.n : Math.max(0, Math.min(web.n, e.edge));
      }
      if (e.z >= 1){
        e.z = 1;
        e.rimT += dt;
        const d = laneDelta(e.edge, pLane + .5);
        e.edge += Math.sign(d) * Math.min(Math.abs(d), RIM_SPEED * dt);
        if (Math.abs(laneDelta(e.edge, pLane + .5)) < .7) loseLife();
        if (e.rimT > 6) killEnemy(e, false);
      }
      continue;
    }

    if (e.type === 'pulsar'){
      e.pulse = (e.pulse + dt * (1.1 + level * .05)) % 1;
      /* an electrified lane kills anything in it, including you at the rim */
      if (e.pulse > .72 && e.z > .35){
        if (e.lane === pLane && !player.grabbed) loseLife();
      }
    }

    /* flip between lanes */
    if (e.flip){
      e.flip.u += dt * 2.6;
      if (e.flip.u >= 1){ e.lane = wrapLane(e.lane + e.flip.dir); e.flip = null; }
    } else {
      e.z += e.speed * dt;
      const wantFlip = e.z > .12 && Math.random() < dt * (e.z >= 1 ? 2.4 : 1.1 + level * .05);
      if (wantFlip && (web.closed || (e.lane > 0 && e.lane < web.n - 1))){
        const d = laneDelta(e.lane, pLane);
        const dir = d === 0 ? (Math.random() < .5 ? 1 : -1) : Math.sign(d);
        if (!web.closed && (e.lane + dir < 0 || e.lane + dir > web.n - 1)) { /* edge of an open web */ }
        else e.flip = { u:0, dir };
      }
      if (e.type !== 'tanker' && e.z > .3 && Math.random() < dt * (.22 + level * .015)){
        eshots.push({ lane: e.lane, z: e.z });
        sfx.blip(320);
      }
    }

    if (e.z >= 1){
      e.z = 1;
      e.rimT += dt;
      if (!e.flip){
        const d = laneDelta(e.lane, pLane);
        if (d === 0){
          if (!player.grabbed && e.rimT > .35) loseLife();
        }
      }
      if (e.rimT > 9) killEnemy(e, false);
    }
  }
}

function superzap(){
  if (zapCharge <= 0) return;
  zapFlash = 1; sfx.superzap();
  if (zapCharge === 2){
    for (const e of enemies.slice()) killEnemy(e, true);
    zapCharge = 1;
  } else {
    const near = enemies.slice().sort((a,b) => b.z - a.z)[0];
    if (near) killEnemy(near, true);
    zapCharge = 0;
  }
}

function updateWarp(dt){
  warpZ += dt * .55;
  const pLane = Math.floor(player.lane + .5) % web.n;
  const L = keys.ArrowLeft || keys.KeyA || touch.l;
  const R = keys.ArrowRight || keys.KeyD || touch.r;
  if (L && !R) player.lane -= PLAYER_SPEED * dt;
  if (R && !L) player.lane += PLAYER_SPEED * dt;
  if (web.closed){ const n = web.n; player.lane = ((player.lane % n) + n) % n; }
  else player.lane = Math.max(0, Math.min(web.n - 1, player.lane));

  /* the spike in your lane rushes at you during the warp */
  if (spikes[pLane] > .05 && warpZ > (1 - spikes[pLane]) && !player.hitSpike){
    player.hitSpike = true;
    loseLife();
    state = 'dead'; holdTimer = 1.6;
    return;
  }
  if (warpZ >= 1.25){
    player.hitSpike = false;
    startLevel(level + 1);
    addScore(level * 100);
  }
}

function burst(p, col, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 190;
    bits.push({ x:p[0], y:p[1], vx:Math.cos(a)*s/400, vy:Math.sin(a)*s/400,
                life:.35 + Math.random() * .5, col });
  }
}

/* ============================================================
   render
   ============================================================ */
function resize(){
  dpr = Math.min(2, devicePixelRatio || 1);
  cw = cvs.clientWidth; ch = cvs.clientHeight;
  cvs.width = Math.round(cw * dpr); cvs.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));

let viewScale = 1, viewY = 0;
function computeView(){
  const bottom = controlsVisible() ? ctrlLayout().y : ch;
  viewScale = Math.min(cw, bottom - 40) * 0.44;
  viewY = (bottom - 20) / 2 + 10;
}
const SX = p => cw / 2 + p[0] * viewScale;
const SY = p => viewY + p[1] * viewScale;

function glow(path, color, w, alpha = 1){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = color;
  ctx.globalAlpha = .10 * alpha; ctx.lineWidth = w * 5;   path();
  ctx.globalAlpha = .22 * alpha; ctx.lineWidth = w * 2.4; path();
  ctx.globalAlpha = 1.0 * alpha; ctx.lineWidth = w;       path();
  ctx.globalAlpha = 1;
}
function vtext(str, x, y, size, color, align = 'center', alpha = 1){
  ctx.save();
  ctx.font = `${size}px "Courier New", monospace`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${Math.max(1, size * .14)}px`;
  glow(() => ctx.strokeText(str, x, y), color, Math.max(.8, size * .055), alpha);
  ctx.restore();
}
function lineTo(a, b){ ctx.moveTo(SX(a), SY(a)); ctx.lineTo(SX(b), SY(b)); }

function drawWeb(zoom = 0){
  const n = web.n, near = 1 + zoom;
  const ring = (z, col, w, al) => glow(() => {
    ctx.beginPath();
    const count = web.closed ? n : n + 1;
    for (let i = 0; i < count; i++){
      const p = edgePt(i, z);
      i === 0 ? ctx.moveTo(SX(p), SY(p)) : ctx.lineTo(SX(p), SY(p));
    }
    if (web.closed) ctx.closePath();
    ctx.stroke();
  }, col, w, al);

  ring(0, pal.web, 1.2, .55);
  glow(() => {
    ctx.beginPath();
    const count = web.closed ? n : n + 1;
    for (let i = 0; i < count; i++) lineTo(edgePt(i, 0), edgePt(i, near));
    ctx.stroke();
  }, pal.web, 1.2, .75);
  ring(near, pal.rim, 2, 1);

  /* spikes grow up their lane toward you */
  for (let i = 0; i < n; i++){
    if (spikes[i] <= 0) continue;
    const h = Math.min(SPIKE_MAX, spikes[i]);
    glow(() => {
      ctx.beginPath();
      lineTo(laneMid(i, 0), laneMid(i, h));
      const t = laneMid(i, h), l = edgePt(i + .25, h * .92), r = edgePt(i + .75, h * .92);
      ctx.moveTo(SX(l), SY(l)); ctx.lineTo(SX(t), SY(t)); ctx.lineTo(SX(r), SY(r));
      ctx.stroke();
    }, pal.accent, 1.3, .85);
  }
}

function drawPlayer(){
  if (state === 'dead') return;
  const a = edgePt(player.lane, 1), b = edgePt(player.lane + 1, 1);
  const mid = laneMid(player.lane, 1), inn = laneMid(player.lane, .82);
  glow(() => {
    ctx.beginPath();
    ctx.moveTo(SX(a), SY(a)); ctx.lineTo(SX(inn), SY(inn)); ctx.lineTo(SX(b), SY(b));
    ctx.moveTo(SX(a), SY(a));
    const a2 = edgePt(player.lane + .18, .93), b2 = edgePt(player.lane + .82, .93);
    ctx.lineTo(SX(a2), SY(a2)); ctx.lineTo(SX(mid), SY(mid));
    ctx.lineTo(SX(b2), SY(b2)); ctx.lineTo(SX(b), SY(b));
    ctx.stroke();
  }, '#fff', 1.8);
}

function drawEnemy(e){
  if (e.type === 'fuseball'){
    const p = edgePt(e.edge, e.z), s = (6 + 10 * depth(e.z)) ;
    glow(() => {
      ctx.beginPath();
      for (let i = 0; i < 4; i++){
        const a = e.t * 6 + i * Math.PI / 4;
        ctx.moveTo(SX(p) - Math.cos(a) * s, SY(p) - Math.sin(a) * s);
        ctx.lineTo(SX(p) + Math.cos(a) * s, SY(p) + Math.sin(a) * s);
      }
      ctx.stroke();
    }, '#ff8a3d', 1.6, .9 + Math.random() * .1);
    return;
  }
  if (e.type === 'spiker'){
    const p = laneMid(e.lane, e.z), s = 4 + 9 * depth(e.z);
    glow(() => {
      ctx.beginPath();
      for (let i = 0; i <= 12; i++){
        const a = e.t * 5 + i * .9, r = s * (i / 12);
        const x = SX(p) + Math.cos(a) * r, y = SY(p) + Math.sin(a) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }, '#7dff7d', 1.4);
    return;
  }

  /* lane-spanning enemies: flipper, tanker, pulsar */
  let k0 = e.lane, k1 = e.lane + 1, lift = 0;
  if (e.flip){
    const u = e.flip.u, d = e.flip.dir;
    lift = Math.sin(Math.PI * u) * .09;
    if (d > 0){ k0 = e.lane + u; k1 = e.lane + 1 + u; }
    else { k0 = e.lane - u; k1 = e.lane + 1 - u; }
  }
  const A = edgePt(k0, e.z), B = edgePt(k1, e.z);
  const M = [(A[0]+B[0])/2 * (1+lift*2), (A[1]+B[1])/2 * (1+lift*2)];
  const col = e.type === 'tanker' ? '#c14dff'
            : e.type === 'pulsar' ? (e.pulse > .72 ? '#fff' : '#4de1ff')
            : pal.accent;
  glow(() => {
    ctx.beginPath();
    if (e.type === 'tanker'){
      const I = laneMid(e.lane, Math.max(0, e.z - .06)), O = laneMid(e.lane, Math.min(1, e.z + .06));
      ctx.moveTo(SX(A), SY(A)); ctx.lineTo(SX(I), SY(I)); ctx.lineTo(SX(B), SY(B));
      ctx.lineTo(SX(O), SY(O)); ctx.closePath();
    } else if (e.type === 'pulsar'){
      ctx.moveTo(SX(A), SY(A));
      for (let i = 1; i <= 5; i++){
        const t = i / 5, p = edgePt(k0 + (k1 - k0) * t, e.z);
        const off = (i % 2 ? 1 : -1) * (5 + 8 * depth(e.z));
        ctx.lineTo(SX(p) + off * .3, SY(p) + off);
      }
    } else {
      ctx.moveTo(SX(A), SY(A)); ctx.lineTo(SX(M), SY(M)); ctx.lineTo(SX(B), SY(B));
      const back = [ (A[0]+B[0])/2 * (1-.06), (A[1]+B[1])/2 * (1-.06) ];
      ctx.lineTo(SX(back), SY(back)); ctx.closePath();
    }
    ctx.stroke();
  }, col, 1.6);

  if (e.type === 'pulsar' && e.pulse > .72){
    glow(() => { ctx.beginPath(); lineTo(laneMid(e.lane, 0), laneMid(e.lane, 1)); ctx.stroke(); },
      '#fff', 1.2, .35 + Math.random() * .5);
  }
}

function drawShots(){
  for (const s of shots){
    const a = laneMid(s.lane, s.z), b = laneMid(s.lane, Math.min(1, s.z + .05));
    glow(() => { ctx.beginPath(); lineTo(a, b); ctx.stroke(); }, '#fff', 2);
  }
  for (const s of eshots){
    const p = laneMid(s.lane, s.z), r = 2 + 4 * depth(s.z);
    glow(() => {
      ctx.beginPath();
      ctx.moveTo(SX(p) - r, SY(p)); ctx.lineTo(SX(p) + r, SY(p));
      ctx.moveTo(SX(p), SY(p) - r); ctx.lineTo(SX(p), SY(p) + r);
      ctx.stroke();
    }, '#ffe14d', 1.6);
  }
}
function drawBits(){
  for (const b of bits)
    glow(() => {
      ctx.beginPath();
      const q = [b.x, b.y], t = [b.x - b.vx * .06, b.y - b.vy * .06];
      ctx.moveTo(SX(q), SY(q));
      ctx.lineTo(SX(t), SY(t));
      ctx.stroke();
    }, b.col, 1.4, Math.min(1, b.life * 2));
}

function drawHUD(){
  const s = Math.max(12, Math.min(18, cw / 44));
  vtext('SCORE ' + score, 18, 30, s, C_TEXT, 'left');
  vtext('HI ' + Math.max(hiScore, score), cw / 2, 30, s, C_TEXT, 'center', .8);
  vtext('LEVEL ' + level, cw - 18, 30, s, C_TEXT, 'right');
  /* lives as little claws */
  for (let i = 0; i < Math.min(lives, 6); i++){
    const x = 22 + i * 22, y = 52;
    glow(() => {
      ctx.beginPath();
      ctx.moveTo(x - 7, y); ctx.lineTo(x, y + 9); ctx.lineTo(x + 7, y);
      ctx.stroke();
    }, '#fff', 1.4, .85);
  }
  if (zapCharge > 0)
    vtext(zapCharge === 2 ? 'ZAP' : 'ZAP \u00B7', cw - 18, 54, s * .8, pal.accent, 'right', .8);
  if (msg) vtext(msg.s, cw / 2, viewY - 10, s * 1.4, C_TEXT, 'center', Math.min(1, msg.t * 2));
}

function drawTitle(){
  const big = Math.max(38, Math.min(96, cw / 9));
  vtext('VORTEX', cw / 2, ch * .3, big, '#4de1ff');
  const s = Math.max(12, Math.min(17, cw / 46));
  vtext('A TUBE SHOOTER', cw / 2, ch * .3 + big * .5, s * 1.1, C_TEXT, 'center', .7);
  vtext('\u2190 \u2192 MOVE ROUND THE RIM     SPACE FIRE     Z SUPERZAPPER',
        cw / 2, ch * .55, s * .9, C_TEXT, 'center', .6);
  vtext('CLEAR EVERY ENEMY OFF THE WEB, THEN WARP DOWN THE TUBE.',
        cw / 2, ch * .55 + s * 1.8, s * .9, C_TEXT, 'center', .6);
  if (hiScore) vtext('HIGH SCORE ' + hiScore, cw / 2, ch * .63, s, '#ffe14d', 'center', .85);
  const b = briefRect();
  glow(() => {
    ctx.beginPath();
    ctx.rect(b.x, b.y, b.w, b.h);
    ctx.stroke();
  }, C_TEXT, 1.1, .5);
  vtext('HOW TO PLAY', b.x + b.w / 2, b.y + b.h / 2 + s * .36, s, C_TEXT, 'center', .85);
  vtext(showTouch ? 'TAP TO START' : 'PRESS SPACE TO START', cw / 2, ch * .92, s, '#fff', 'center',
        Math.floor(performance.now() / 500) % 2 ? .35 : 1);
}
const BRIEF = [
  ['THE WEB', 'You sit on the near rim of a tube. Everything hostile climbs up the lanes toward you. Move round the rim, fire down your lane, and clear the web.'],
  ['FLIPPER', 'Red. Flips lane to lane as it climbs and hunts your position. At the rim it will take you if you are in its lane.'],
  ['TANKER', 'Purple. Slow and harmless until shot, then it splits into two of something worse in the lanes either side.'],
  ['SPIKER', 'Green spinner. Rides its lane spinning out a spike behind it. Shoot the spike down or it will spear you during the warp.'],
  ['FUSEBALL', 'Orange sparks. Rides the lane edges rather than the lanes, wandering sideways. Hard to hit, deadly at the rim.'],
  ['PULSAR', 'Blue zigzag. Periodically electrifies its whole lane. Do not be standing in it when it lights up.'],
  ['SUPERZAPPER', 'Z or the fourth pad. First use clears the web. Second use kills only the nearest thing, then it is spent until the next level.'],
  ['THE WARP', 'Clear the web and you fly down the tube. Any spike still standing in your lane will kill you, so shoot them down before the last enemy dies.'],
];
function drawBriefing(){
  const s = Math.max(11, Math.min(15, cw / 52));
  vtext('HOW TO PLAY', cw / 2, 60, s * 1.7, C_TEXT);
  let y = 100;
  const M = Math.max(18, cw * .07), W = cw - M * 2;
  for (const [k, v] of BRIEF){
    vtext(k, M, y, s * 1.05, '#ffe14d', 'left');
    y += s * 1.5;
    /* measure with the letter spacing vtext draws with, or the wrap runs long */
    ctx.save();
    ctx.font = `${s}px "Courier New", monospace`;
    if ('letterSpacing' in ctx) ctx.letterSpacing = `${Math.max(1, s * .14)}px`;
    const words = v.split(' '), lines = [];
    let line = '';
    for (const w of words){
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > W && line){ lines.push(line); line = w; }
      else line = t;
    }
    if (line) lines.push(line);
    ctx.restore();
    for (const ln of lines){ vtext(ln, M, y, s, C_TEXT, 'left', .8); y += s * 1.35; }
    y += s * .7;
    if (y > ch - 60) break;
  }
  vtext(showTouch ? 'TAP TO GO BACK' : 'PRESS H OR ESC TO GO BACK', cw / 2, ch - 26, s, '#fff', 'center', .7);
}
function drawGameOver(){
  const big = Math.max(28, Math.min(64, cw / 13));
  vtext('GAME OVER', cw / 2, ch * .4, big, '#ff4d4d');
  vtext('SCORE ' + score, cw / 2, ch * .4 + big * .9, big * .5, C_TEXT);
  if (score >= hiScore && score > 0) vtext('NEW HIGH SCORE', cw / 2, ch * .4 + big * 1.5, big * .35, '#ffe14d');
  if (holdTimer <= 0)
    vtext(showTouch ? 'TAP TO CONTINUE' : 'PRESS SPACE', cw / 2, ch * .75, Math.max(12, cw / 48), '#fff', 'center',
          Math.floor(performance.now() / 500) % 2 ? .35 : 1);
}
function drawControls(){
  const L = ctrlLayout(), r = 5;
  const box = (k, on, draw) => {
    const b = L[k];
    glow(() => { ctx.beginPath(); ctx.rect(b.x, b.y, b.w, L.h); ctx.stroke(); },
      C_TEXT, on ? 2 : 1.1, on ? 1 : .4);
    draw(b.x + b.w / 2, L.y + L.h / 2, on);
  };
  const g = Math.min(20, L.h * .25);
  box('l', touch.l, (x,y,on) => glow(() => { ctx.beginPath();
    ctx.moveTo(x+g*.4,y-g*.5); ctx.lineTo(x-g*.5,y); ctx.lineTo(x+g*.4,y+g*.5); ctx.stroke(); },
    C_TEXT, 2, on?1:.6));
  box('r', touch.r, (x,y,on) => glow(() => { ctx.beginPath();
    ctx.moveTo(x-g*.4,y-g*.5); ctx.lineTo(x+g*.5,y); ctx.lineTo(x-g*.4,y+g*.5); ctx.stroke(); },
    C_TEXT, 2, on?1:.6));
  box('f', touch.f, (x,y,on) => glow(() => { ctx.beginPath();
    ctx.moveTo(x,y-g*.6); ctx.lineTo(x,y+g*.6); ctx.moveTo(x-g*.35,y-g*.15);
    ctx.lineTo(x,y-g*.6); ctx.lineTo(x+g*.35,y-g*.15); ctx.stroke(); },
    '#fff', 2, on?1:.7));
  box('z', touch.z, (x,y,on) => glow(() => { ctx.beginPath();
    ctx.moveTo(x-g*.35,y-g*.55); ctx.lineTo(x+g*.15,y-g*.1); ctx.lineTo(x-g*.15,y+g*.1);
    ctx.lineTo(x+g*.35,y+g*.55); ctx.stroke(); },
    zapCharge ? pal.accent : '#555', 2, on?1:.7));
}

/* ============================================================
   loop
   ============================================================ */
let prev = performance.now();
function frame(now){
  let dt = (now - prev) / 1000; prev = now;
  dt = Math.min(dt, 1/20);
  update(dt);
  computeView();

  ctx.globalAlpha = 1;
  ctx.fillStyle = state === 'briefing' ? '#03030a' : 'rgba(3,3,10,0.42)';
  ctx.fillRect(0, 0, cw, ch);
  if (zapFlash > 0){
    ctx.fillStyle = `rgba(255,255,255,${zapFlash * .22})`;
    ctx.fillRect(0, 0, cw, ch);
  }

  ctx.save();
  if (shake > 0){ const k = shake * 8; ctx.translate((Math.random()-.5)*k, (Math.random()-.5)*k); }

  if (state === 'title') drawTitle();
  else if (state === 'briefing') drawBriefing();
  else {
    drawWeb(state === 'warp' ? warpZ * 2.2 : 0);
    if (state !== 'warp'){ for (const e of enemies) drawEnemy(e); drawShots(); }
    drawPlayer();
    drawBits();
    drawHUD();
    if (state === 'gameover') drawGameOver();
  }
  ctx.restore();
  if (controlsVisible()) drawControls();
  requestAnimationFrame(frame);
}

/* ============================================================
   audio
   ============================================================ */
const sfx = {
  ac:null, on:true, noise:null,
  unlock(){
    if (this.ac){ if (this.ac.state === 'suspended') this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    const len = this.ac.sampleRate * 1.5;
    this.noise = this.ac.createBuffer(1, len, this.ac.sampleRate);
    const d = this.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  toggle(){ this.on = !this.on; },
  tone(f0, f1, dur, type = 'square', vol = .12){
    if (!this.ac || !this.on) return;
    const t = this.ac.currentTime;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + .02);
  },
  noiseBurst(dur, f0, f1, vol){
    if (!this.ac || !this.on) return;
    const t = this.ac.currentTime;
    const s = this.ac.createBufferSource(); s.buffer = this.noise;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    s.connect(f).connect(g).connect(this.ac.destination); s.start(t); s.stop(t + dur + .02);
  },
  zap(){ this.tone(900, 180, .09, 'square', .07); },
  pop(){ this.noiseBurst(.22, 2200, 200, .22); },
  boom(){ this.noiseBurst(1.0, 1400, 60, .4); },
  blip(f){ this.tone(f, f * .6, .07, 'sawtooth', .06); },
  tick(){ this.tone(260, 200, .04, 'square', .05); },
  warp(){ this.tone(160, 1400, .7, 'sawtooth', .1); },
  superzap(){ this.tone(1800, 90, .5, 'sawtooth', .16); this.noiseBurst(.5, 3000, 200, .2); },
};

/* ---------- boot ---------- */
buildWeb(1);
player = { lane: 4, cool: 0, grabbed: null };
resize();
requestAnimationFrame(frame);
</script>
</body>
